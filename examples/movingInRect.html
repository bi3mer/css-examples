<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Move Rectangle in Path</title>
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <main>
      <pre id="css"></pre>
      <div id="viewer">
        <div class="rect"></div>
      </div>
    </main>

    <style id="css-code">
      #viewer {
        container-type: size;
      }

      .rect {
        width: 100px;
        height: 100px;
        background: mediumpurple;
        animation-name: lap;
        animation-duration: 4s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }

      @keyframes lap {
        0% {
          transform: translate(0, 0);
        }

        25% {
          transform: translate(calc(100cqw - 100%), 0);
        }

        50% {
          transform: translate(calc(100cqw - 100%), calc(100cqh - 100%));
        }

        75% {
          transform: translate(0, calc(100cqh - 100%));
        }

        100% {
          transform: translate(0, 0);
        }
      }
    </style>
    <script src="../viewer.js"></script>
  </body>
</html>
